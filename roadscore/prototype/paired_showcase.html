<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RoadScore demo</title>
<style>body{margin:0;background:#070b0c;color:#f4f5f6;font:17px system-ui;text-align:center}main{max-width:1440px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px}h1{font-size:22px;margin:0}.screen{position:relative;background:#000;aspect-ratio:2.23}img{width:100%;height:100%;object-fit:contain}.notice{position:absolute;inset:0;display:grid;place-items:center;background:#000b;font-size:24px}.notice[hidden]{display:none}section{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:12px}button,a{border:1px solid #506166;border-radius:10px;padding:12px 18px;background:#19262a;color:white;font:inherit;text-decoration:none;cursor:pointer}button.on{background:#0b6d59;border-color:#69dec3}button:disabled{opacity:.4;cursor:default}small{color:#a8b8bc}#error{color:#ffcc94;min-height:24px;margin:0 10px}body:fullscreen main{max-width:none}</style>
<main><header><h1>RoadScore</h1><small id="state">Connecting to the comma…</small><button id="fullscreen">Full screen</button></header>
<div class="screen"><img id="view" alt="Live mirror of the comma replay"><div class="notice" id="notice">Preparing saved replay…</div></div>
<section><button data-field="mode" data-value="engaged">Demo engage</button><button data-field="mode" data-value="disengaged">Demo disengage</button><button data-field="mode" data-value="recorded">Recorded engagement</button></section>
<section><button data-field="signal_mode" data-value="left">Left signal</button><button data-field="signal_mode" data-value="right">Right signal</button><button data-field="signal_mode" data-value="off">Signals off</button><button data-field="signal_mode" data-value="recorded">Recorded signals</button><a id="galaxy" target="_blank" rel="noopener">Open Galaxy</a></section>
<p id="error"></p><small>Saved soundtrack · live presentation controls · actual comma screen</small></main>
<script>
const view=document.querySelector('#view'),notice=document.querySelector('#notice'),buttons=[...document.querySelectorAll('[data-field]')];let session,frame=0,blob;
document.querySelector('#fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
buttons.forEach(button=>button.onclick=async()=>{try{const response=await fetch('/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:session,field:button.dataset.field,value:button.dataset.value})});const result=await response.json();if(!response.ok)throw Error(result.error);document.querySelector('#error').textContent=''}catch(error){document.querySelector('#error').textContent=error.message}});
async function status(){try{const response=await fetch('/status');const data=await response.json();if(!response.ok)throw Error(data.error);const demo=data.peer.demo;session=demo.session_id;buttons.forEach(button=>{button.disabled=!demo.available;button.classList.toggle('on',demo[button.dataset.field]===button.dataset.value)});document.querySelector('#state').textContent=data.phase+(data.muted?' · muted test':' · audio from comma');document.querySelector('#galaxy').href=data.galaxy_url}catch(error){buttons.forEach(button=>button.disabled=true);document.querySelector('#state').textContent='Connection unavailable'}setTimeout(status,250)}
async function picture(){try{const response=await fetch('/frame?n='+frame++);if(!response.ok)throw Error('No fresh frame');const next=URL.createObjectURL(await response.blob());view.src=next;if(blob)URL.revokeObjectURL(blob);blob=next;notice.hidden=true}catch(error){notice.hidden=false;notice.textContent='Waiting for the comma screen…'}setTimeout(picture,30)}
status();picture();
</script>
